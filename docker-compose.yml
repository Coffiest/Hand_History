# Local development: Postgres + recognition service + web app.
# The web app can also be run outside Docker with `pnpm dev` against these.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: handhistory_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  recognition:
    build: ./services/recognition
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - postgres
      - recognition
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:localdev@postgres:5432/handhistory_dev
      RECOGNITION_SERVICE_URL: http://recognition:8080
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

volumes:
  pgdata:
